name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - run: unzip -q CrystalGuard.zip
      - run: gradle assembleDebug
        working-directory: CrystalGuard
      - uses: actions/upload-artifact@v4
        with:
          name: CrystalGuard-apk
          path: CrystalGuard/app/build/outputs/apk/debug/app-debug.apk
